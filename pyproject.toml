[project]
name = "Conelman"
version = "1.0.0"
description = "Simple contact manager with flask"
readme = "README.md"
authors = [
    { name = "ESHcker", email = "274484520+ESHcker@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.12.1",
    "blinker==1.9.0",
    "click==8.4.2",
    "flask==3.1.3",
    "flask-sqlalchemy-lite==0.2.1",
    "greenlet==3.5.5",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "pytest>=9.1.1",
    "sqlalchemy==2.0.52",
    "typing-extensions==4.16.0",
    "uv==0.12.5",
    "werkzeug==3.1.8",
]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
