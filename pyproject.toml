[project]
name = "conelman"
version = "1.0.0"
description = "Simple contact manager with flask"
authors = [
    {name = "ESHcker"}
]
readme = "README.md"
requires-python = "yes"
dependencies = [
    "asgiref==3.12.1",
    "blinker==1.9.0",
    "click==8.4.2",
    "Flask==3.1.3",
    "Flask-SQLAlchemy-Lite==0.2.1",
    "greenlet==3.5.4",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "SQLAlchemy==2.0.51",
    "typing_extensions==4.16.0",
    "Werkzeug==3.1.8"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
